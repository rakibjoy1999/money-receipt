<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Money Receipt Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body{
      font-family: "Times New Roman", serif;
      background:#f4f6f9;
      padding:20px;
    }

    .box{
      max-width:900px;
      margin:auto;
      background:white;
      padding:20px;
      border:2px solid black;
    }

    h1{
      text-align:center;
      margin:0;
    }

    input{
      width:100%;
      padding:8px;
      margin:5px 0;
    }

    .btn{
      padding:10px 15px;
      background:black;
      color:white;
      border:none;
      cursor:pointer;
      margin-top:10px;
    }

    .receipt{
      margin-top:20px;
      padding:20px;
      border:1px solid #000;
    }

    .row{
      display:flex;
      justify-content:space-between;
    }
  </style>
</head>

<body>

<div class="box">

<h1>Money Receipt Generator</h1>

<h3>Fill Information</h3>

<input id="name" placeholder="Receiver Name">
<input id="amount" placeholder="Amount (TK)">
<input id="purpose" placeholder="Purpose">
<input id="journal" placeholder="Journal Name">
<input id="title" placeholder="Article Title">
<input id="date" placeholder="Date">

<button class="btn" onclick="generate()">Generate Receipt</button>
<button class="btn" onclick="downloadPDF()">Download PDF</button>

<div id="receipt" class="receipt">

  <h2 style="text-align:center;">BD Medical Research</h2>
  <p style="text-align:center;">Money Receipt</p>

  <div class="row">
    <div>Receipt No: <b>001</b></div>
    <div>Date: <span id="rdate"></span></div>
  </div>

  <hr>

  <p>Received With Thanks From: <b id="rname"></b></p>
  <p>Amount: <b id="ramount"></b> TK</p>
  <p>In Word: <b id="rword"></b></p>
  <p>Purpose: <b id="rpurpose"></b></p>

  <p>Journal: <b id="rjournal"></b></p>
  <p>Article Title: <b id="rtitle"></b></p>

  <br><br>

  <div class="row">
    <div>Checked By</div>
    <div>Approved By</div>
    <div>Received By</div>
  </div>

</div>

</div>

<script>
function generate(){
  let name = document.getElementById("name").value;
  let amount = document.getElementById("amount").value;
  let purpose = document.getElementById("purpose").value;
  let journal = document.getElementById("journal").value;
  let title = document.getElementById("title").value;
  let date = document.getElementById("date").value;

  document.getElementById("rname").innerText = name;
  document.getElementById("ramount").innerText = amount;
  document.getElementById("rpurpose").innerText = purpose;
  document.getElementById("rjournal").innerText = journal;
  document.getElementById("rtitle").innerText = title;
  document.getElementById("rdate").innerText = date;

  document.getElementById("rword").innerText = amount + " Taka Only";
}

function downloadPDF(){
  let element = document.getElementById('receipt');
  html2pdf().from(element).save('money-receipt.pdf');
}
</script>

</body>
</html>
